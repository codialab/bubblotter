[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bubblotter"
version = "0.1.0"
description = "Simple tool for plotting SV bubbles within a GFA file."
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name="Peter Heringer", email="peter.heringer@hhu.de" },
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib"
]

[project.urls]
"Homepage" = "https://github.com/codialab/bubblotter"
"Bug Tracker" = "https://github.com/codialab/bubblotter/issues"

[project.scripts]
bubblotter = "bubblotter.main:main"
